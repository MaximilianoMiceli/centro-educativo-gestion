spring:
  application:
    name: gestion
  datasource:
    url: ${CENTRO_DB_URL:jdbc:postgresql://localhost:5434/centro_educativo}
    username: ${CENTRO_DB_USER:centro}
    password: ${CENTRO_DB_PASSWORD:centro}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  correo:
    # SIN_ENVIO arma y guarda los correos sin enviarlos. Más adelante se puede sumar un servicio real.
    modo: ${CORREO_MODO:SIN_ENVIO}
    programado: ${CORREO_PROGRAMADO:true}
    cron: ${CORREO_CRON:0 0 9 * * *}
  jwt:
    secret: ${JWT_SECRET:esta-es-una-clave-secreta-para-desarrollo-solamente-cambiar-en-produccion}
    expiration: ${JWT_EXPIRATION:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

logging:
  level:
    ar.edu.utn.centroeducativo: DEBUG
