services:
  postgres:
    image: postgres:15-alpine
    container_name: centro-postgres
    environment:
      POSTGRES_DB: centro_educativo
      POSTGRES_USER: centro
      POSTGRES_PASSWORD: centro
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centro -d centro_educativo"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: centro-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@centro.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
